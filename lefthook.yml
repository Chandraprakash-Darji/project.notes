pre-commit:
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: bun run lint {staged_files}
    format:
      run: bun run format

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: bunx tsc --noEmit
    test:
      run: bun run test:run
