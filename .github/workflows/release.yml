name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Determine version, write changelog, push tag, create GitHub Release ──
  release:
    name: Create release
    runs-on: ubuntu-latest
    # Skip the commit that release-it itself pushes (version bump + changelog).
    # GITHUB_TOKEN pushes don't re-trigger workflows, but this guards manual runs too.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    outputs:
      released: ${{ steps.run.outputs.released }}
      version: ${{ steps.run.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so conventional-changelog can read all commits

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-it
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          bunx release-it --ci
          AFTER=$(node -p "require('./package.json').version")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true"    >> "$GITHUB_OUTPUT"
            echo "version=v$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "released=false"  >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build .dmg on macOS and attach it to the release ──────────────────
  build-dmg:
    name: Build macOS DMG
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }} # build the tagged commit

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Build Tauri app (signed + notarized)
        env:
          # Code signing — required
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization — required for Gatekeeper to accept the DMG
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun tauri build

      - name: Upload DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          gh release upload "${{ needs.release.outputs.version }}" "$DMG" --clobber
